<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1a25"/>
      <stop offset="100%" stop-color="#071119"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7cc4ff"/>
      <stop offset="100%" stop-color="#2b6cb0"/>
    </linearGradient>
  </defs>
  <!-- Safe-zone padded background so this also works as a maskable icon. -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- River / flood-control gate motif: a barrier pin above three contour waves. -->
  <g>
    <path d="M96 300 Q 146 268 196 300 T 296 300 T 396 300 T 416 300" fill="none" stroke="#1f3f52" stroke-width="14" stroke-linecap="round"/>
    <path d="M86 344 Q 146 304 206 344 T 326 344 T 426 344" fill="none" stroke="url(#wave)" stroke-width="18" stroke-linecap="round"/>
    <path d="M96 392 Q 156 356 216 392 T 336 392 T 416 392" fill="none" stroke="#4aa8e0" stroke-width="16" stroke-linecap="round" opacity="0.85"/>
  </g>
  <!-- Flood-gate structure -->
  <g fill="#e6f1f7">
    <rect x="180" y="140" width="18" height="150" rx="4"/>
    <rect x="314" y="140" width="18" height="150" rx="4"/>
    <rect x="168" y="122" width="176" height="26" rx="6"/>
    <rect x="222" y="176" width="68" height="76" rx="6" fill="#2fb5c8"/>
  </g>
</svg>
